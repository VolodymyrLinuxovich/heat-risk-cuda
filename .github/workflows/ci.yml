name: ci

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: pip install -e ".[dev]"
      - run: ruff check
      - run: mypy src bench
      - run: pytest -m "not gpu" -rs

  native:
    # Builds the C++ CPU implementation with CMake and runs its native unit tests, under GCC and
    # Clang, with warnings as errors.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_CXX_FLAGS=-Werror
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  nvrtc:
    # Compiles the CUDA kernel with NVRTC on a runner with no GPU. Fails (never skips) if
    # cuda.core cannot be imported here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with gpu extra
        run: pip install -e ".[dev,gpu]"
      - run: pytest -m nvrtc -rs -v
        env:
          HEAT_RISK_REQUIRE_NVRTC: "1"
